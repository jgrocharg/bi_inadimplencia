<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BI Inadimplência</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: faixa de filtro + KPIs, regional em destaque, depois base/vendedor/aging e tabela de faturas */
:root{--bg:#eef2f7;--surface:#fff;--ink:#0f1b2d;--ink2:#34445a;--muted:#5b6b80;--line:#cfd8e3;--accent:#034893;--accent-soft:#dbe8f8;--neutral:#8794a5;--warn:#b4531a;--c-ne:#034893;--c-cs:#f08c00;--c-az:#12a37f;--c-dir:#6b7a8d;--grid:#dde4ed;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{background:var(--surface);border:1px solid var(--line);border-bottom:4px solid #EDDF00;border-radius:8px;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-size:22px;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--ink2);font-size:13px;margin-top:2px}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi,.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 22px var(--mono);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:13px;color:var(--ink2);margin-top:2px}
.kpi.main .v{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
h2{font-size:14px;margin:0 0 2px;font-weight:600}
.card .d{color:var(--ink2);font-size:12px;margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(70px,130px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.bar .tr{height:14px;position:relative}
.bar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar .fill.neu{background:var(--neutral)}
.bar .val{font:12px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.bar:hover .nm{color:var(--ink)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.m{font-family:var(--mono)}
tr.reg{cursor:pointer}tr.reg:hover td{background:var(--bg)}
tr.sel td{background:var(--accent-soft)}
.pill{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--ink2)}
.note{font-size:12px;color:var(--ink2);line-height:1.5}
.note b{color:var(--ink)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:4px;display:none;z-index:9}
input[type=search]{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;width:200px;max-width:100%}
.hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#creg svg{max-width:600px}svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans);fill:var(--ink2);font-size:12px}
svg .vt{font-family:var(--mono);fill:var(--ink);font-size:11px}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .col{cursor:pointer}svg .col:hover{opacity:.8}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.donutw{display:flex;flex-direction:column;align-items:center}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo img{display:block;height:58px;width:auto}
.brand .sep{width:1px;align-self:stretch;background:var(--line)}
.kpi.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chip[aria-pressed=false]{opacity:.45}.chip[aria-pressed=true]{color:var(--ink);border-color:var(--ink2)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hd .f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hd .f label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip i{height:10px;width:10px;border-radius:2px}
.mt{margin-top:14px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:30px}
.fbar .chip{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.kpi.clk{cursor:pointer}.kpi.clk:hover{border-color:var(--accent)}
.bar{cursor:pointer;border-radius:4px}.bar:hover{background:var(--accent-soft)}
.sm .bar{font-size:11px;grid-template-columns:minmax(70px,100px) 1fr auto}.sm .val{font-size:10.5px}.sm .bars{gap:5px}
.pc{display:block;font-size:11px;color:var(--muted);font-family:var(--sans)}.pc.up{color:#c0392b;font-weight:600}.pc.dn{color:#12804f;font-weight:600}

.bar .tr{margin-top:6px}
.bar .fill{position:relative;border-radius:0;background:var(--accent)}
.bar .fill.neu{background:var(--neutral)}
.bar .fill::before{content:"";position:absolute;left:0;top:-5px;width:calc(100% + 6px);height:5px;background:inherit;filter:brightness(1.35);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bar .fill::after{content:"";position:absolute;right:-6px;top:-5px;width:6px;height:calc(100% + 5px);background:inherit;filter:brightness(.68);clip-path:polygon(0 5px,100% 0,100% calc(100% - 5px),0 100%)}
.wide .bar{grid-template-columns:minmax(130px,210px) 1fr auto}
tr.hl td{background:var(--accent-soft)}
tr.tot td{border-top:2px solid var(--ink2);font-weight:600}
tr.mrow{cursor:pointer}tr.mrow:hover td{background:var(--bg)}
.imp{display:flex;flex-direction:column;gap:8px;padding:10px 16px}
.impr{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.impb{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;padding:6px 14px;font-size:13px}
.impr .f{display:flex;gap:8px;align-items:center}.impr label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.impr input[type=date]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
.imp.drag{outline:2px dashed var(--accent);outline-offset:2px;background:var(--accent-soft)}
#imsg.err{color:#c0392b;font-weight:600}#imsg.ok{color:#12804f}#imsg.warn{color:var(--warn)}
#imsg:empty{display:none}
</style>

 $('chips').innerHTML=ORD.map(n=>`<button class="chip" data-n="${n}" aria-pressed="${on.has(n)}"><i style="background:var(${MC[n]})"></i>${n}</button>`).join('');
 document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{const n=c.dataset.n;if(on.has(n)){if(on.size>1)on.delete(n)}else on.add(n);evo()});
 const vis=ORD.filter(n=>on.has(n));
 const W=900,H=300,L=56,B=32,T=34,tt=i=>vis.reduce((a,n)=>a+all[n][i],0),mx=Math.max(...ms.map((_,i)=>tt(i)),1),step=Math.pow(10,Math.floor(Math.log10(mx))),top=Math.ceil(mx/step)*step;
 const gw=(W-L)/ms.length,bw=Math.min(46,gw*.6),dx=12,dy=9;
 let g='';for(let i=0;i<=4;i++){const y=H-B-(H-B-T)*i/4;g+=`<line class="gl" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${sh(top*i/4)}</text>`}
 ms.forEach((k,i)=>g+=`<rect data-m="${k}" data-t="${mlab(k)} · total ${brl2(tt(i))}" x="${L+gw*i}" y="${T-8}" width="${gw}" height="${H-B-T+8}" fill="${F.mes===k?'var(--accent-soft)':'transparent'}"/>`);
 ms.forEach((k,i)=>{const cx=L+gw*(i+.5),dim=F.mes&&F.mes!==k?.35:1;let yb=H-B;
  vis.forEach(n=>{const v=all[n][i],h=(H-B-T)*v/top;if(h<=0)return;yb-=h;
   g+=`<g data-m="${k}" data-n="${n}" data-t="${n} · venc. ${mlab(k)}: ${brl2(v)}" opacity="${dim}">${box(cx-(bw+dx)/2,yb,bw,h,dx,dy,MC[n])}</g>`});
  if(tt(i)>0)g+=`<text class="vt" x="${cx}" y="${yb-dy-5}" text-anchor="middle" opacity="${dim}">${sh(tt(i))}</text>`;
  g+=`<text data-m="${k}" x="${cx}" y="${H-10}" text-anchor="middle" style="${F.mes===k?'font-weight:700;fill:var(--ink)':''}">${mlab(k)}</text>`});
 $('cline').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo em aberto por mês de vencimento e regional">${g}</svg>`;
 document.querySelectorAll('#cline [data-m]').forEach(e=>{e.style.cursor='pointer';show(e,e.dataset.t);e.onclick=()=>{const n=e.dataset.n,k=e.dataset.m;if(n){if(F.reg===n&&F.mes===k){setReg(null);F.mes=null}else{setReg(n);F.mes=k}}else F.mes=F.mes===k?null:k;render()}});
 const tr=i=>ORD.reduce((a,n)=>a+all[n][i],0),gt=ORD.reduce((a,n)=>a+all[n].reduce((x,y)=>x+y,0),0);
 $('tmes').innerHTML=`<tr><th>Vencimento</th>${ORD.map(n=>`<th class="r" style="color:var(${MC[n]})">${n}</th>`).join('')}<th class="r">Total</th></tr>`+
 ms.map((k,i)=>`<tr class="mrow ${F.mes===k?'hl':''}" data-k="${k}"><td>${mlab(k)}</td>${ORD.map(n=>`<td class="r m">${brl(all[n][i])}</td>`).join('')}<td class="r m"><b>${brl(tr(i))}</b></td></tr>`).join('')+
 `<tr class="tot"><td>Total</td>${ORD.map(n=>`<td class="r m">${brl(all[n].reduce((a,b)=>a+b,0))}</td>`).join('')}<td class="r m">${brl(gt)}</td></tr>`;
 document.querySelectorAll('#tmes tr.mrow').forEach(r=>r.onclick=()=>tog('mes',r.dataset.k));
}
function drawTab(){
 const A=filt(),q=$('q').value.trim().toLowerCase();
 let L=A.filter(r=>!q||(r.cli+r.fat+r.base).toLowerCase().includes(q));
 L=[...L].sort((a,b)=>(a[sortK]>b[sortK]?1:a[sortK]<b[sortK]?-1:0)*sortD);
 const cols=[['cli','Cliente'],['fat','Fatura'],['venc','Vencimento'],['dias','Dias atraso','r'],['v','Saldo','r'],['base','Base'],['reg','Regional']];
 $('tfat').innerHTML='<tr>'+cols.map(c=>`<th class="${c[2]||''}" data-k="${c[0]}">${c[1]}${sortK===c[0]?(sortD>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>'+
 L.slice(0,400).map(r=>`<tr><td>${esc(r.cli)}</td><td class="m">${r.fat}</td><td>${r.venc.split('-').reverse().join('/')}</td><td class="r m">${r.dias}</td><td class="r m">${brl2(r.v)}</td><td>${r.base}</td><td>${r.reg}</td></tr>`).join('');
 document.querySelectorAll('#tfat th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(sortK===k)sortD*=-1;else{sortK=k;sortD=k==='v'||k==='dias'?-1:1}drawTab()});
}
$('q').oninput=drawTab;
const fmtD=s=>s.split('-').reverse().join('/');
function status(msg,cls){const m=$('imsg');m.textContent=msg||'';m.className=cls||'';if(!msg)$('dref').value=D.ref}
function persist(){try{if(SRC)localStorage.setItem(LSK,JSON.stringify({D,src:SRC}));else localStorage.removeItem(LSK)}catch(e){}}
function applyData(nd,src){D=nd;SRC=src;setup();fillSel();Object.keys(F).forEach(k=>F[k]=null);on=new Set(ORD);persist();render();status()}
const nh=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const pnum=v=>{if(typeof v==='number')return v;if(v==null||v==='')return NaN;let s=String(v).replace(/R\$|\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const pdate=v=>{if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round(v-25569)*864e5).toISOString().slice(0,10);
 if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
 const s=String(v??'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
 m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return null};
const sheetOf=(wb,key)=>{const n=wb.SheetNames.find(s=>nh(s)===key);return n?wb.Sheets[n]:null};
function parseWB(wb){
 const ws=sheetOf(wb,'inadimplencia geral');if(!ws)throw new Error('Aba "INADIMPLENCIA GERAL" não encontrada no arquivo.');
 const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
 if(A.length<2)throw new Error('A aba INADIMPLENCIA GERAL está vazia.');
 const H=A[0].map(nh),ix=(f,d)=>{const i=H.findIndex(f);return i>=0?i:d};
 const c={fat:ix(x=>x==='fatura',3),venc:ix(x=>x==='vencimento',5),v:ix(x=>x.startsWith('saldo'),6),vend:ix(x=>x==='vendedor',7),base:ix(x=>x.includes('base'),8),reg:ix(x=>x==='regional',9)};
 const rows=[];let skip=0;
 A.slice(1).forEach(r=>{if(!r||r.every(x=>x==null||x===''))return;
  const fat=pnum(r[c.fat]),v=pnum(r[c.v]),venc=pdate(r[c.venc]),reg=String(r[c.reg]??'').trim().toUpperCase(),base=String(r[c.base]??'').trim().toUpperCase();
  if(!isFinite(fat)||!isFinite(v)||!venc||!reg){skip++;return}
  rows.push([String(r[0]??'').trim(),Math.round(fat),venc,v,String(r[c.vend]??'').trim(),base||'DIRETORIA',reg])});
 if(!rows.length)throw new Error('Nenhuma fatura válida encontrada. Confira as colunas Fatura, Vencimento, Saldo à Pagar e Regional.');
 rows.sort((a,b)=>a[2]<b[2]?-1:a[2]>b[2]?1:a[1]-b[1]);
 const fat={},aviso=[];
 [['GERAL','faturamento geral'],['NORDESTE','faturamento nordeste'],['CENTRO-SUL','faturamento centro-sul']].forEach(([k,sn])=>{
  const s=sheetOf(wb,sn);if(!s){fat[k]=D.fat[k];aviso.push('aba '+sn.toUpperCase()+' ausente (mantido o valor anterior)');return}
  const t=XLSX.utils.sheet_to_json(s,{header:1,raw:true,defval:null}).reduce((a,r)=>{const n=pnum(r[1]);return a+(isFinite(n)?n:0)},0);
  if(!(t>0)){fat[k]=D.fat[k];aviso.push('aba '+sn.toUpperCase()+' sem valores (mantido o valor anterior)');return}
  fat[k]=Math.round(t*100)/100});
 return{rows,fat,skip,aviso}}
async function importFile(f){
 if(!f)return;
 if(typeof XLSX==='undefined'){status('Não foi possível carregar o leitor de Excel (biblioteca SheetJS). Verifique a conexão com a internet e recarregue a página.','err');return}
 try{status('Lendo '+f.name+'…');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),p=parseWB(wb);
  const ref=$('dref').value||D.ref;
  applyData({rows:p.rows,fat:p.fat,ref},{file:f.name,when:new Date().toLocaleString('pt-BR')});
  const ex=[];if(p.skip)ex.push(p.skip+' linha(s) ignorada(s) por dados incompletos');ex.push(...p.aviso);
  if(ex.length)status(`Importado: ${p.rows.length} faturas, saldo ${brl2(sum(R))}, data base ${fmtD(D.ref)}. Atenção: ${ex.join('; ')}.`,'warn')
 }catch(e){status('Erro ao importar: '+e.message,'err')}
 finally{$('fimp').value=''}}
$('bimp').onclick=()=>$('fimp').click();
$('fimp').onchange=e=>importFile(e.target.files[0]);
$('dref').onchange=e=>{if(e.target.value)applyData({...D,ref:e.target.value},SRC)};
const imp=$('imp');
['dragenter','dragover'].forEach(t=>imp.addEventListener(t,e=>{e.preventDefault();imp.classList.add('drag')}));
['dragleave','drop'].forEach(t=>imp.addEventListener(t,e=>{e.preventDefault();imp.classList.remove('drag')}));
imp.addEventListener('drop',e=>importFile(e.dataTransfer.files[0]));
render();status();
</script>
